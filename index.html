<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>बातचीत (BaatCheet)</title>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100vw; overflow: hidden; background-color: #f0f2f5; }
    .hidden { display: none !important; }

    /* Main App Layout */
    #app-container { display: flex; height: 100vh; width: 100vw; position: relative; }
    
    #sidebar { width: 320px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; height: 100%; flex-shrink: 0; }
    #chat-pane { flex: 1; display: flex; flex-direction: column; height: 100%; background: #efeae2; position: relative; }

    .header { height: 60px; background: #f0f2f5; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #16a34a; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    .btn-icon { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px; }

    .contact-item { padding: 12px; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .contact-item.active { background: #e8f5e9; }

    /* Messages & Input Bar */
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .message-bubble { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg-out { background: #dcf8c6; align-self: flex-end; }
    .msg-in { background: #ffffff; align-self: flex-start; }

    /* PERMANENT TYPING BOX FIX */
    .chat-input-bar { 
      height: 60px; 
      background: #f0f2f5; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      padding: 8px 12px; 
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    
    .input-field { flex: 1; height: 40px; padding: 0 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; outline: none; background: #fff; }
    .send-btn { height: 40px; padding: 0 16px; background: #16a34a; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Mobile Screen Responsiveness */
    @media (max-width: 768px) {
      #sidebar { width: 100%; position: absolute; inset: 0; z-index: 10; }
      #chat-pane { width: 100%; position: absolute; inset: 0; z-index: 20; transform: translateX(100%); transition: transform 0.2s ease; }
      #app-container.chat-open #chat-pane { transform: translateX(0); }
    }

    /* Modal Overlay */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 99; }
    .modal-card { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; }
  </style>
</head>
<body>

  <!-- LOGIN / REGISTER -->
  <div id="auth-container" class="modal">
    <div class="modal-card" style="text-align:center;">
      <h2 style="margin-bottom: 12px;">बातचीत Login</h2>
      <input type="text" id="user-name-input" class="input-field" placeholder="Enter Your Name" style="width:100%; margin-bottom:10px;">
      <button onclick="loginUser()" class="send-btn" style="width:100%;">Start Chatting</button>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app-container" class="hidden">
    
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="header">
        <div style="display:flex; align-items:center; gap:8px;">
          <div id="my-avatar" class="avatar">?</div>
          <div>
            <div id="my-name" style="font-weight:bold; font-size:14px;">Name</div>
            <div id="my-code" style="font-size:11px; color:#16a34a; font-weight:bold;">BC0000</div>
          </div>
        </div>
        <button onclick="openAddModal()" class="btn-icon" title="Add Contact">➕</button>
      </div>
      <div id="contacts-list" style="flex:1; overflow-y:auto;"></div>
    </div>

    <!-- MAIN CHAT PANE (TYPING BOX ALWAYS VISIBLE) -->
    <div id="chat-pane">
      <div class="header">
        <button onclick="closeMobileChat()" class="btn-icon" style="margin-right:8px;">⬅️</button>
        <div style="flex:1;">
          <div id="chat-title" style="font-weight:bold; font-size:14px;">Select or Add a Contact</div>
        </div>
      </div>

      <div id="messages-container" class="chat-messages">
        <div style="text-align:center; color:#777; font-size:12px; margin-top:20px;">
          Tap '+' on top left to add a contact code, or choose a contact to send messages.
        </div>
      </div>

      <!-- ALWAYS VISIBLE TYPING INPUT BAR -->
      <form class="chat-input-bar" onsubmit="sendMessage(event)">
        <input type="text" id="msg-input" class="input-field" placeholder="Type a message..." required autocomplete="off">
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>

  </div>

  <!-- ADD CONTACT MODAL -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-card">
      <h3 style="margin-bottom:10px;">Add Contact</h3>
      <input type="text" id="friend-code" class="input-field" placeholder="Friend Code (e.g. BC1234)" style="width:100%; margin-bottom:8px; text-transform:uppercase;">
      <input type="text" id="friend-name" class="input-field" placeholder="Friend Name" style="width:100%; margin-bottom:12px;">
      <div style="display:flex; gap:8px;">
        <button onclick="closeAddModal()" class="send-btn" style="background:#888; flex:1;">Cancel</button>
        <button onclick="confirmAddContact()" class="send-btn" style="flex:1;">Add</button>
      </div>
    </div>
  </div>

  <script>
    /* FIREBASE CONFIGURATION - REPLACE WITH YOUR KEYS */
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null;
    let contacts = [];
    let activeChat = null;

    window.onload = () => {
      const saved = localStorage.getItem('bc_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        contacts = JSON.parse(localStorage.getItem(`bc_contacts_${currentUser.code}`)) || [];
        showApp();
      }
    };

    function loginUser() {
      const name = document.getElementById('user-name-input').value.trim();
      if (!name) return alert('Enter your name');
      
      const code = 'BC' + Math.floor(1000 + Math.random() * 9000);
      currentUser = { name, code };
      localStorage.setItem('bc_user', JSON.stringify(currentUser));
      showApp();
    }

    function showApp() {
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      document.getElementById('my-name').innerText = currentUser.name;
      document.getElementById('my-code').innerText = currentUser.code;
      document.getElementById('my-avatar').innerText = currentUser.name[0].toUpperCase();
      renderContacts();
    }

    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

    function confirmAddContact() {
      const code = document.getElementById('friend-code').value.trim().toUpperCase();
      const name = document.getElementById('friend-name').value.trim();
      if (!code || !name) return alert('Fill all fields');

      const roomId = [currentUser.code, code].sort().join('_');
      const newContact = { id: roomId, code, name };
      contacts.push(newContact);
      localStorage.setItem(`bc_contacts_${currentUser.code}`, JSON.stringify(contacts));
      
      closeAddModal();
      renderContacts();
      selectContact(newContact);
    }

    function renderContacts() {
      const list = document.getElementById('contacts-list');
      list.innerHTML = '';
      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = 'contact-item';
        item.innerHTML = `<div class="avatar">${c.name[0].toUpperCase()}</div><div><b>${c.name}</b><br><small>${c.code}</small></div>`;
        item.onclick = () => selectContact(c);
        list.appendChild(item);
      });
    }

    function selectContact(c) {
      activeChat = c;
      document.getElementById('chat-title').innerText = c.name + " (" + c.code + ")";
      document.getElementById('app-container').classList.add('chat-open');
      
      // Sync messages live
      db.ref('chats/' + activeChat.id).on('value', snapshot => {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(m => {
            const isMe = m.sender === currentUser.code;
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isMe ? 'msg-out' : 'msg-in'}`;
            bubble.innerText = m.text;
            container.appendChild(bubble);
          });
          container.scrollTop = container.scrollHeight;
        }
      });
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      if (!activeChat) return alert('Please add/select a contact first!');

      db.ref('chats/' + activeChat.id).push({
        sender: currentUser.code,
        text: text,
        time: Date.now()
      });

      input.value = '';
    }

    function closeMobileChat() {
      document.getElementById('app-container').classList.remove('chat-open');
    }
  </script>
</body>
</html>
